[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dividend-analyzer"
version = "1.0.0"
description = "A professional, multi-version dividend stock analysis and portfolio scoring engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Dividend Analysis Team" }
]
dependencies = [
    "yfinance>=0.2.41",
    "pandas>=2.2.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.5",
    "matplotlib>=3.8.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
dividend-analyzer = "dividend_analyzer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
